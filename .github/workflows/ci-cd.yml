name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: turb-gpt-free-register-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python and Sentinel entrypoints
        run: |
          python -m compileall -q main.py web.py wsgi.py core config webui
          node --check sentinel/sentinel-runner.js
          node --check sentinel/sdk.js
      - name: Run deployment gate tests
        run: >-
          python -m unittest -v
          tests.test_app_state_db
          tests.test_sqlite_state_migration
          tests.test_wireproxy_runtime
          tests.test_webui_auth

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test image
        run: |
          docker build --pull --tag turb-gpt-free-register:ci .
          docker run --rm turb-gpt-free-register:ci wireproxy --version
          docker run --rm turb-gpt-free-register:ci python -c "import cloakbrowser; print(cloakbrowser.__version__)"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned SSH trust
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "${RUNNER_TEMP}/turb-ssh"
          printf '%s\n' "${OVH_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/turb-ssh/id_ed25519"
          printf '%s\n' "${OVH_KNOWN_HOSTS}" > "${RUNNER_TEMP}/turb-ssh/known_hosts"
          chmod 600 "${RUNNER_TEMP}/turb-ssh/id_ed25519" "${RUNNER_TEMP}/turb-ssh/known_hosts"
      - name: Deploy on ovh-sing
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
        run: >-
          ssh -i "${RUNNER_TEMP}/turb-ssh/id_ed25519"
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="${RUNNER_TEMP}/turb-ssh/known_hosts"
          "${OVH_USER}@${OVH_HOST}"
          'cd /srv/turb-gpt-free-register && bash deploy/deploy.sh'
