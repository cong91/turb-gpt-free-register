name: CI/CD

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: turb-gpt-free-register-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python and Sentinel entrypoints
        run: |
          python -m compileall -q main.py web.py wsgi.py core config webui
          node --check sentinel/sentinel-runner.js
          node --check sentinel/sdk.js
      - name: Run deployment gate tests
        run: >-
          python -m unittest -v
          tests.test_app_state_db
          tests.test_sqlite_state_migration
          tests.test_wireproxy_runtime
          tests.test_webui_auth

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image-ref.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image reference
        id: image-ref
        run: echo "value=ghcr.io/cong91/turb-gpt-free-register:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/cong91/turb-gpt-free-register:sha-${{ github.sha }}
            ghcr.io/cong91/turb-gpt-free-register:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        env:
          IMAGE_REF: ghcr.io/cong91/turb-gpt-free-register:sha-${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            docker pull "${IMAGE_REF}"
          fi
          docker run --rm "${IMAGE_REF}" wireproxy --version
          docker run --rm "${IMAGE_REF}" python -c "from cloakbrowser import launch; browser=launch(headless=True, humanize=False, geoip=False, args=['--disable-crashpad-for-testing']); page=browser.new_page(); page.goto('data:text/html,<title>cloak-ok</title>'); print('cloak', page.title()); browser.close()"
          docker run --rm "${IMAGE_REF}" python -c "from core.cloakbrowser_driver import build_cloak_driver; driver, opened = build_cloak_driver(proxy=''); print('adapter', opened.raw['driver']); driver.quit()"

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned SSH trust
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "${RUNNER_TEMP}/turb-ssh"
          printf '%s\n' "${OVH_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/turb-ssh/id_ed25519"
          printf '%s\n' "${OVH_KNOWN_HOSTS}" > "${RUNNER_TEMP}/turb-ssh/known_hosts"
          chmod 600 "${RUNNER_TEMP}/turb-ssh/id_ed25519" "${RUNNER_TEMP}/turb-ssh/known_hosts"
      - name: Deploy on ovh-sing
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          printf '%s' "${GHCR_TOKEN}" | ssh -i "${RUNNER_TEMP}/turb-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RUNNER_TEMP}/turb-ssh/known_hosts" \
            "${OVH_USER}@${OVH_HOST}" \
            "set -Eeuo pipefail; trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT; docker login ghcr.io --username '${{ github.actor }}' --password-stdin; TURB_IMAGE='${IMAGE_REF}' bash /srv/turb-gpt-free-register/deploy/deploy.sh"
